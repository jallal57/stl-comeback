<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>STL Come-back</title>
  <meta name="description" content="Programme de réathlétisation : musculation et vélo, 2 séances par semaine.">
  <meta name="theme-color" content="#0f766e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="STL Come-back">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <button class="back" id="backBtn" hidden aria-label="Retour">‹ Retour</button>
    <h1 id="title">STL Come-back</h1>
  </header>

  <main id="view"></main>

  <div class="timer" id="timer" hidden>
    <div class="timer-label" id="timerLabel">Récupération</div>
    <div class="timer-time" id="timerTime">0:00</div>
    <button class="timer-btn" id="timerPlus">+15 s</button>
    <button class="timer-btn" id="timerStop">Passer</button>
  </div>

  <nav class="tabs">
    <button data-tab="home" class="active"><span class="ico">◎</span>Programme</button>
    <button data-tab="history"><span class="ico">☰</span>Historique</button>
    <button data-tab="tests"><span class="ico">▲</span>Bilan</button>
    <button data-tab="infos"><span class="ico">i</span>Infos</button>
  </nav>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" defer></script>
  <script src="js/program.js"></script>
  <script src="js/pdf.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
